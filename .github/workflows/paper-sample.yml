name: Paper sample build

on:
  push:
    paths:
      - 'demos/paper-smp-diagnostics/**'
      - '.github/workflows/paper-sample.yml'
  pull_request:
    paths:
      - 'demos/paper-smp-diagnostics/**'
      - '.github/workflows/paper-sample.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn -B -f demos/paper-smp-diagnostics/pom.xml clean package
